[build]
  publish = "sito"
  functions = "netlify/functions"

[functions]
  # esbuild include sito/scorte.json dentro le funzioni (import in netlify/lib/scorte.mjs)
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
